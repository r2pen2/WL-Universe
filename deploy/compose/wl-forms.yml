services:
  wl-forms:
    image: ghcr.io/r2pen2/wl-universe-wl-forms:${WL_FORMS_IMAGE_TAG:-latest}
    container_name: wl-forms
    restart: unless-stopped
    env_file:
      - ${WL_FORMS_ENV_FILE:-/opt/services/data/app-env/wl-forms.env}
    environment:
      PORT: "3023"
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.wl-forms.rule: Host(`wl-forms.joed.dev`)
      traefik.http.routers.wl-forms.entrypoints: web
      traefik.http.services.wl-forms.loadbalancer.server.port: "3023"

networks:
  proxy:
    external: true
