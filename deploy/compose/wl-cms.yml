services:
  wl-cms:
    image: ghcr.io/r2pen2/wl-universe-wl-cms:${WL_CMS_IMAGE_TAG:-latest}
    container_name: wl-cms
    restart: unless-stopped
    env_file:
      - ${WL_CMS_ENV_FILE:-/opt/services/data/app-env/wl-cms.env}
    environment:
      PORT: "3021"
      WL_CMS_ASSETS_DIR: /opt/services/data/app-assets/wl-cms
    volumes:
      - ${WL_CMS_ASSETS_PATH:-/opt/services/data/app-assets/wl-cms}:/opt/services/data/app-assets/wl-cms
      # lib/sites.js falls back to /opt/services/data/app-env/<slug>-serviceAccountKey.json
      # (the same files each site's pre-migration server already used) when no
      # WL_CMS_SA_<SITE> override is set, so mount that dir read-only.
      - /opt/services/data/app-env:/opt/services/data/app-env:ro
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.wl-cms.rule: Host(`wl-cms.joed.dev`)
      traefik.http.routers.wl-cms.entrypoints: web
      traefik.http.services.wl-cms.loadbalancer.server.port: "3021"

networks:
  proxy:
    external: true
