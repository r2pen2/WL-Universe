# Prod compose for beyond-the-bell (static SPA).
services:
  beyond-the-bell:
    image: ghcr.io/r2pen2/wl-universe-beyond-the-bell:${BEYOND_THE_BELL_IMAGE_TAG:-latest}
    container_name: beyond-the-bell
    restart: unless-stopped
    env_file:
      - ${BEYOND_THE_BELL_ENV_FILE:-/opt/services/data/app-env/beyond-the-bell.env}
    environment:
      PORT: "8080"
      WL_CMS_SITE: beyond-the-bell
      WL_AUTH_SITE: beyond-the-bell
      WL_FORMS_SITE: beyond-the-bell
      SITE_MAIL_SITE_SLUG: beyond-the-bell
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.beyond-the-bell.rule: Host(`beyondthebelleducation.com`) || Host(`www.beyondthebelleducation.com`)
      traefik.http.routers.beyond-the-bell.entrypoints: web
      traefik.http.services.beyond-the-bell.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
