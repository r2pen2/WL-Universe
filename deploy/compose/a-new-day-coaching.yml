services:
  a-new-day-coaching:
    image: ghcr.io/r2pen2/wl-universe-a-new-day-coaching:${A_NEW_DAY_COACHING_IMAGE_TAG:-latest}
    container_name: a-new-day-coaching
    restart: unless-stopped
    env_file:
      - ${A_NEW_DAY_COACHING_ENV_FILE:-/opt/services/data/app-env/a-new-day-coaching.env}
    environment:
      PORT: "8080"
      WL_CMS_SITE: a-new-day-coaching
      WL_AUTH_SITE: a-new-day-coaching
      WL_FORMS_SITE: a-new-day-coaching
      SITE_MAIL_SITE_SLUG: andc
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.a-new-day-coaching.rule: Host(`anewdaycoaching.com`) || Host(`www.anewdaycoaching.com`)
      traefik.http.routers.a-new-day-coaching.entrypoints: web
      traefik.http.services.a-new-day-coaching.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
