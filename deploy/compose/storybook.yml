services:
  storybook:
    image: ghcr.io/r2pen2/wl-universe-storybook:${STORYBOOK_IMAGE_TAG:-latest}
    container_name: wl-universe-storybook
    restart: unless-stopped
    # WL_CMS_URL + WL_CMS_READ_API_KEY (read-only), from scripts/glados/provision-cms-read-key.sh
    env_file:
      - /opt/services/data/app-env/storybook.env
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.wl-universe-storybook.rule: Host(`storybook.joed.dev`)
      traefik.http.routers.wl-universe-storybook.entrypoints: web
      traefik.http.services.wl-universe-storybook.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
