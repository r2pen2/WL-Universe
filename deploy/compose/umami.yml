# Umami analytics (infra peer of Dozzle — upstream image, not GHCR app matrix).
# Runtime on glados: /opt/services/infra/umami/compose.yml
# Secrets: /opt/services/data/app-env/umami.env (never commit)
#
# Required in umami.env:
#   POSTGRES_PASSWORD=...
#   APP_SECRET=...   # openssl rand -base64 32
# Optional:
#   UMAMI_ADMIN_PASSWORD=...  # used by provision scripts only (not read by containers)

services:
  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in umami.env}
    volumes:
      - ${UMAMI_DB_DATA_PATH:-/opt/services/data/app-assets/umami/db}:/var/lib/postgresql/data
    networks:
      - umami_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in umami.env}@umami-db:5432/umami
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in umami.env}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - proxy
      - umami_internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.umami.rule: Host(`analytics.joed.dev`)
      traefik.http.routers.umami.entrypoints: web
      traefik.http.services.umami.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    init: true

networks:
  proxy:
    external: true
  umami_internal:
    driver: bridge
