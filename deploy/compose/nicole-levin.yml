services:
  nicole-levin:
    image: ghcr.io/r2pen2/wl-universe-nicole-levin:${NICOLE_LEVIN_IMAGE_TAG:-latest}
    container_name: nicole-levin
    restart: unless-stopped
    env_file:
      - ${NICOLE_LEVIN_ENV_FILE:-/opt/services/data/app-env/nicole-levin.env}
    environment:
      PORT: "8080"
      WL_CMS_SITE: nicole-levin
      WL_AUTH_SITE: nicole-levin
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.nicole-levin.rule: Host(`nicolelevin.org`) || Host(`www.nicolelevin.org`)
      traefik.http.routers.nicole-levin.entrypoints: web
      traefik.http.services.nicole-levin.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
