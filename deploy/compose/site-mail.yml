services:
  site-mail:
    image: ghcr.io/r2pen2/wl-universe-site-mail:${SITE_MAIL_IMAGE_TAG:-latest}
    container_name: site-mail
    restart: unless-stopped
    env_file:
      - ${SITE_MAIL_ENV_FILE:-/opt/services/data/app-env/site-mail.env}
    environment:
      PORT: "3020"
      SITE_MAIL_LOG_DIR: /opt/services/data/app-assets/site-mail
    volumes:
      - ${SITE_MAIL_ASSETS_PATH:-/opt/services/data/app-assets/site-mail}:/opt/services/data/app-assets/site-mail
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.site-mail.rule: Host(`site-mail.joed.dev`)
      traefik.http.routers.site-mail.entrypoints: web
      traefik.http.services.site-mail.loadbalancer.server.port: "3020"

networks:
  proxy:
    external: true
