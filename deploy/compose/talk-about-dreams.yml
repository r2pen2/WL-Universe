services:
  talk-about-dreams:
    image: ghcr.io/r2pen2/wl-universe-talk-about-dreams:${TALK_ABOUT_DREAMS_IMAGE_TAG:-latest}
    container_name: talk-about-dreams
    restart: unless-stopped
    env_file:
      - ${TALK_ABOUT_DREAMS_ENV_FILE:-/opt/services/data/app-env/talk-about-dreams.env}
    environment:
      PORT: "8080"
      WL_CMS_SITE: talk-about-dreams
      WL_AUTH_SITE: talk-about-dreams
      SITE_MAIL_SITE_SLUG: talk-about-dreams
    networks:
      - proxy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.talk-about-dreams.rule: Host(`talkaboutdreams.com`) || Host(`www.talkaboutdreams.com`)
      traefik.http.routers.talk-about-dreams.entrypoints: web
      traefik.http.services.talk-about-dreams.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
