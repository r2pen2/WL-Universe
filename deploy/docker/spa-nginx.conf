server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CRA SPA — client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /wl-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /liveness {
    default_type application/json;
    return 200 '{"ok":true,"service":"spa-static"}';
  }
}
