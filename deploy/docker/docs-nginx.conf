server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Next static export with trailingSlash: true
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
