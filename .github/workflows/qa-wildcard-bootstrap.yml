name: QA Cloudflare wildcard bootstrap

# One-time / idempotent: *.joed.dev DNS + tunnel ingress → Traefik (r2pen2/devops).
# Requires repository secret CLOUDFLARE_API_TOKEN (never commit the token).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    uses: r2pen2/devops/.github/workflows/reusable-qa-wildcard.yml@main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
