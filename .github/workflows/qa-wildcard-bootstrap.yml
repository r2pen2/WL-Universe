name: QA Cloudflare wildcard bootstrap
on:
  workflow_dispatch:
    inputs:
      mode:
        default: godaddy-probe
      domain:
        default: beyondthebelleducation.com
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          GODADDY_PAT: ${{ secrets.GODADDY_PAT }}
          GODADDY_DOMAIN: ${{ inputs.domain }}
          MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "godaddy-probe" ]]; then
            node scripts/dns/godaddy-probe.mjs
          else
            node scripts/qa/ensure-qa-wildcard.mjs
          fi
