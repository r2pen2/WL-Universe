name: QA Cloudflare wildcard bootstrap

# One-time / idempotent: *.qa.joed.dev DNS + tunnel ingress → Traefik.
# Requires repository secret CLOUDFLARE_API_TOKEN (never commit the token).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: ensure *.qa.joed.dev
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure QA wildcard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          node scripts/qa/ensure-qa-wildcard.mjs
