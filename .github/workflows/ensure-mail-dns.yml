name: Ensure mail DNS (MX + SPF)

# Idempotent: apply inbound mail MX/SPF from deploy/dns/sites + extras.
# Requires repository secret CLOUDFLARE_API_TOKEN (Zone DNS Edit; never commit the token).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Cloudflare writes)"
        type: boolean
        default: false
      apps:
        description: "Optional app slugs (comma-separated). Empty = all sites + extras."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ensure:
    name: ensure mail DNS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure MX + SPF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MAIL_APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [[ -n "${MAIL_APPS}" ]]; then
            node scripts/dns/ensure-mail-dns.mjs --apps "${MAIL_APPS}"
          else
            node scripts/dns/ensure-mail-dns.mjs
          fi
