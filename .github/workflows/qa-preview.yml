name: QA preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: qa-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Detect, build pr-N images, deploy on the active host and comment the URLs: r2pen2/devops,
  # driven by deploy/apps.json. The checks below run against what it deployed.
  preview:
    uses: r2pen2/devops/.github/workflows/reusable-qa-preview.yml@main
    with:
      catalog: deploy/apps.json
    secrets: inherit

  liveness:
    name: feature liveness
    needs: preview
    if: needs.preview.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe deployed QA hosts
        env:
          PR: ${{ github.event.pull_request.number }}
          APPS_JSON: ${{ needs.preview.outputs.apps }}
        run: |
          set -euo pipefail
          sleep 5
          fail=0
          mapfile -t apps < <(node -e 'JSON.parse(process.env.APPS_JSON).forEach(a=>console.log(a))')
          for app in "${apps[@]}"; do
            if ! node scripts/liveness/check.mjs --only "$app" --pr "$PR" --skip-live; then
              fail=1
            fi
          done
          exit "$fail"

  accessibility:
    name: accessibility (Lighthouse)
    needs: preview
    if: needs.preview.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit previews against the live sites
        env:
          PR: ${{ github.event.pull_request.number }}
          APPS_CSV: ${{ needs.preview.outputs.apps_csv }}
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          # Fails if a preview scores lower than its live site or fails a new audit.
          node scripts/qa/a11y-check.mjs --pr "$PR" --only "$APPS_CSV"
