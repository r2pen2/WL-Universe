name: Ensure billing.joed.dev hostname

# Idempotent: DNS CNAME + Cloudflare Tunnel ingress → Traefik.
# Requires repository secret CLOUDFLARE_API_TOKEN (never commit the token).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/billing/ensure-billing-hostname.mjs"
      - "deploy/compose/site-billing.yml"
      - ".github/workflows/ensure-billing-hostname.yml"
      - "packages/site-billing/**"
      - "deploy/billing/**"

permissions:
  contents: read

jobs:
  bootstrap:
    name: ensure billing.joed.dev
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure billing hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          node scripts/billing/ensure-billing-hostname.mjs
