name: Publish app images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/**"
      - "deploy/docker/**"
      - "deploy/compose/**"
      - "deploy/dns/**"
      - "scripts/**"
      - ".github/workflows/publish-app-images.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nicole-levin
            port: 3005
          - app: a-new-day-coaching
            port: 3007
          - app: a-new-day-coaching-crm
            port: 3008
          - app: beyond-the-bell
            port: 3000
          - app: wl-admin-portal
            port: 25565
          - app: you-can-do-it-gardening
            port: 3003
          - app: joe-dobbelaar
            port: 3002
          - app: talk-about-dreams
            port: 3004
          - app: boston-mixtape
            port: 3010
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wl-universe-${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/node-react-express.Dockerfile
          build-args: |
            APP_DIR=packages/${{ matrix.app }}
            APP_NAME=${{ matrix.app }}
            PORT=${{ matrix.port }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy (${{ matrix.app }})
    needs: publish
    runs-on:
      - self-hosted
      - glados
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nicole-levin
          - app: a-new-day-coaching
          - app: a-new-day-coaching-crm
          - app: beyond-the-bell
          - app: wl-admin-portal
          - app: you-can-do-it-gardening
          - app: joe-dobbelaar
          - app: talk-about-dreams
          - app: boston-mixtape
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy compose app
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          app_dir="/opt/services/apps/${app}"
          compose_file="${app_dir}/compose.yml"

          sudo mkdir -p "${app_dir}"
          sudo cp "deploy/compose/${app}.yml" "${compose_file}"

          cd "${app_dir}"
          sudo docker compose -f "${compose_file}" pull
          sudo docker compose -f "${compose_file}" up -d
          sudo docker compose -f "${compose_file}" ps

      # Idempotent: only apps mapped in deploy/dns/godaddy-domains.json.
      # Already-correct Cloudflare NS are left alone.
      - name: Sync GoDaddy nameservers
        if: contains(fromJSON('["a-new-day-coaching","a-new-day-coaching-crm","you-can-do-it-gardening","wl-admin-portal","talk-about-dreams","boston-mixtape"]'), matrix.app)
        env:
          GODADDY_PAT: ${{ secrets.GODADDY_PAT }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          GODADDY_SHOPPER_ID: ${{ secrets.GODADDY_SHOPPER_ID }}
        run: |
          node scripts/dns/set-godaddy-nameservers.mjs --app "${{ matrix.app }}"
