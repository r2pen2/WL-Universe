name: Publish app images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/**"
      - "deploy/docker/**"
      - "deploy/compose/**"
      - "deploy/billing/**"
      - "deploy/dns/**"
      - "scripts/**"
      - ".github/workflows/publish-app-images.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to build/deploy (comma-separated), or "all"'
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      apps_csv: ${{ steps.detect.outputs.apps_csv }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
      mail_apps_csv: ${{ steps.detect.outputs.mail_apps_csv }}
      has_mail_apps: ${{ steps.detect.outputs.has_mail_apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect apps
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            input="${INPUT_APPS:-all}"
            if [ "${input}" = "all" ] || [ -z "${input}" ]; then
              json="$(node -e '
                import("./scripts/qa/apps.mjs").then((m) => {
                  const apps = m.PUBLISH_APPS.map((a) => a.app);
                  console.log(JSON.stringify({ apps, files: ["workflow_dispatch:all"], scope: "publish" }));
                })
              ')"
            else
              # Validate requested app names against the publish catalog.
              json="$(node -e '
                import("./scripts/qa/apps.mjs").then((m) => {
                  const wanted = process.env.INPUT_APPS.split(",").map((s) => s.trim()).filter(Boolean);
                  const known = new Set(m.PUBLISH_APPS.map((a) => a.app));
                  const apps = [];
                  for (const name of wanted) {
                    if (!known.has(name)) {
                      console.error("Unknown app:", name);
                      process.exit(1);
                    }
                    apps.push(name);
                  }
                  console.log(JSON.stringify({ apps, files: ["workflow_dispatch:" + wanted.join(",")], scope: "publish" }));
                })
              ')"
            fi
          else
            before="${BEFORE_SHA:-}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              echo "No usable before SHA; building all publish apps."
              json="$(node -e '
                import("./scripts/qa/apps.mjs").then((m) => {
                  const apps = m.PUBLISH_APPS.map((a) => a.app);
                  console.log(JSON.stringify({ apps, files: ["fallback:all"], scope: "publish" }));
                })
              ')"
            else
              json="$(node scripts/qa/detect-changed-apps.mjs \
                --base "${before}" \
                --head "${HEAD_SHA}" \
                --scope publish \
                --json)"
            fi
          fi

          echo "detect=${json}"
          apps="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(j.apps||[]))' "${json}")"
          csv="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write((j.apps||[]).join(","))' "${json}")"
          count="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(String((j.apps||[]).length))' "${json}")"

          # Intersection of changed apps with deploy/dns/sites/*.json email.enabled
          mail_csv="$(node -e '
            import("./scripts/dns/load-mail-config.mjs").then((m) => {
              const changed = new Set(JSON.parse(process.argv[1]));
              const mail = m.listEmailEnabledApps().filter((a) => changed.has(a));
              process.stdout.write(mail.join(","));
            })
          ' "${apps}")"

          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "apps_csv=${csv}" >> "$GITHUB_OUTPUT"
          echo "mail_apps_csv=${mail_csv}" >> "$GITHUB_OUTPUT"
          if [ -n "${mail_csv}" ]; then
            echo "has_mail_apps=true" >> "$GITHUB_OUTPUT"
            echo "Will ensure mail DNS for: ${mail_csv}"
          else
            echo "has_mail_apps=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${count}" = "0" ]; then
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            echo "No publishable apps changed — skipping build/deploy."
          else
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
            echo "Will build/deploy: ${csv}"
          fi

  ensure-mail-dns:
    name: ensure mail DNS (changed email sites)
    needs: detect
    if: needs.detect.outputs.has_mail_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure MX + SPF for changed email-enabled apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAIL_APPS: ${{ needs.detect.outputs.mail_apps_csv }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          node scripts/dns/ensure-mail-dns.mjs --apps "${MAIL_APPS}"

  # Single runner so Buildx boots once (moby/buildkit pull).
  publish:
    name: build (${{ matrix.app }})
    needs: detect
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    # One job per app, all at once (each shows up separately in the Actions UI).
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve build settings
        id: app
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          node -e '
            import("./scripts/qa/apps.mjs").then((m) => {
              const a = m.PUBLISH_APPS.find((x) => x.app === process.env.APP);
              const out = a
                ? `build=true\nport=${a.port}\ndockerfile=${a.dockerfile || "deploy/docker/node-react-express.Dockerfile"}\n`
                : "build=false\n";
              process.stdout.write(out);
            })
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.app.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.app.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.app.outputs.build == 'true'
        env:
          APP: ${{ matrix.app }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          PORT: ${{ steps.app.outputs.port }}
          DOCKERFILE: ${{ steps.app.outputs.dockerfile }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/wl-universe-${APP}"
          docker buildx build \
            --file "${DOCKERFILE}" \
            --build-arg "APP_DIR=packages/${APP}" \
            --build-arg "APP_NAME=${APP}" \
            --build-arg "PORT=${PORT}" \
            --tag "${image}:latest" \
            --tag "${image}:${SHA}" \
            --cache-from "type=gha,scope=${APP}" \
            --cache-to "type=gha,mode=max,scope=${APP}" \
            --push \
            .

  deploy:
    name: deploy (${{ matrix.app }})
    needs:
      - detect
      - publish
    runs-on:
      - self-hosted
      - glados
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.detect.outputs.has_apps == 'true' &&
      needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # wl-auth files content change requests as Plane tickets (routes/changeRequests.js) and emails
      # Joe about each one through site-mail (lib/notify.js). Merges the Plane secrets and site-mail's
      # API key (read from site-mail.env on glados) into its env file; other lines are kept, values are
      # never printed.
      - name: Plane and mail env for wl-auth
        if: matrix.app == 'wl-auth'
        env:
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          PLANE_WORKSPACE_SLUG: ${{ secrets.PLANE_WORKSPACE_SLUG }}
        run: |
          set -euo pipefail
          ENV=/opt/services/data/app-env/wl-auth.env
          [ -n "$PLANE_API_KEY" ] || { echo "::error::PLANE_API_KEY secret is missing"; exit 1; }
          sudo test -f "$ENV" || { echo "::error::$ENV missing"; exit 1; }
          MAIL_KEY=$(sudo sed -n 's/^SITE_MAIL_API_KEY=//p' /opt/services/data/app-env/site-mail.env 2>/dev/null | head -1 || true)
          [ -n "$MAIL_KEY" ] || echo "::warning::No SITE_MAIL_API_KEY in site-mail.env; change request emails are off"
          { sudo grep -vE '^(PLANE_API_KEY|PLANE_WORKSPACE_SLUG|SITE_MAIL_API_KEY)=' "$ENV" || true
            printf 'PLANE_API_KEY=%s\nPLANE_WORKSPACE_SLUG=%s\n' "$PLANE_API_KEY" "${PLANE_WORKSPACE_SLUG:-main}"
            [ -z "$MAIL_KEY" ] || printf 'SITE_MAIL_API_KEY=%s\n' "$MAIL_KEY"
          } | sudo sh -c "umask 077; cat > '$ENV.new'"
          sudo mv "$ENV.new" "$ENV"
          echo "Plane and mail settings written to $ENV"

      # site-billing emails Joe a monthly "set aside for taxes" report (lib/taxReport.js) through
      # site-mail. Copies site-mail's API key into site-billing.env; other lines are kept, the value is
      # never printed.
      - name: Mail env for site-billing
        if: matrix.app == 'site-billing'
        run: |
          set -euo pipefail
          ENV=/opt/services/data/app-env/site-billing.env
          sudo test -f "$ENV" || { echo "::warning::$ENV missing; skipping mail key"; exit 0; }
          MAIL_KEY=$(sudo sed -n 's/^SITE_MAIL_API_KEY=//p' /opt/services/data/app-env/site-mail.env 2>/dev/null | head -1 || true)
          if [ -z "$MAIL_KEY" ]; then echo "::warning::No SITE_MAIL_API_KEY in site-mail.env; tax report emails are off"; exit 0; fi
          { sudo grep -vE '^SITE_MAIL_API_KEY=' "$ENV" || true
            printf 'SITE_MAIL_API_KEY=%s\n' "$MAIL_KEY"
          } | sudo sh -c "umask 077; cat > '$ENV.new'"
          sudo mv "$ENV.new" "$ENV"
          echo "Mail settings written to $ENV"

      # New v2 sites (scripts/qa/apps.mjs entries with `provision`) get their env file, service
      # account and auth/forms/mail keys on glados before the first deploy. Idempotent; never
      # overwrites existing values or prints secrets.
      - name: Provision site env
        run: |
          set -euo pipefail
          args=$(node -e '
            import("./scripts/qa/apps.mjs").then((m) => {
              const a = m.APP_BY_NAME[process.argv[1]];
              if (a && a.provision) {
                console.log([a.app, a.provision.serviceAccountFrom, a.provision.mailProfileFrom || ""].join(" "));
              }
            })
          ' "${{ matrix.app }}")
          if [ -z "${args}" ]; then echo "No provisioning for ${{ matrix.app }}"; exit 0; fi
          # shellcheck disable=SC2086
          sudo bash scripts/glados/provision-site.sh ${args}

      # The component catalog reads live prod CMS content with a read-only wl-cms key
      # (scripts/glados/provision-cms-read-key.sh): generated into wl-cms.env, copied to storybook.env.
      - name: Read-only CMS key for the catalog
        if: matrix.app == 'storybook' || matrix.app == 'wl-cms'
        run: sudo bash scripts/glados/provision-cms-read-key.sh

      - name: Deploy compose app
        env:
          # Private per-client billing details (scripts/billing/merge-private-clients.mjs); only read for site-billing.
          SITE_BILLING_CLIENTS_JSON: ${{ matrix.app == 'site-billing' && secrets.SITE_BILLING_CLIENTS_JSON || '' }}
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          app_dir="/opt/services/apps/${app}"
          compose_file="${app_dir}/compose.yml"

          sudo mkdir -p "${app_dir}"
          sudo cp "deploy/compose/${app}.yml" "${compose_file}"

          if [ "${app}" = "site-billing" ]; then
            sudo mkdir -p "${app_dir}/catalog"
            sudo mkdir -p /opt/services/data/app-assets/site-billing
            sudo mkdir -p /opt/services/infra/traefik/dynamic
            sudo cp deploy/billing/sites.json "${app_dir}/catalog/sites.json"
            # Client billing details aren't in this public repo; merge them in from the secret.
            printf '%s' "${SITE_BILLING_CLIENTS_JSON}" | sudo node scripts/billing/merge-private-clients.mjs "${app_dir}/catalog/sites.json"
            sudo cp scripts/billing/enforce-compose.mjs /opt/services/bin/wl-billing-enforce-compose.mjs
            sudo chmod +x /opt/services/bin/wl-billing-enforce-compose.mjs
            sudo cp deploy/cron/wl-billing.cron /etc/cron.d/wl-billing
            sudo chmod 644 /etc/cron.d/wl-billing
            if [ ! -f /opt/services/data/app-env/site-billing.env ]; then
              sudo cp deploy/compose/site-billing.env.example /opt/services/data/app-env/site-billing.env
              echo "::warning::Created stub site-billing.env — fill STRIPE_SECRET_KEY then re-run bootstrap"
            fi
            sudo cp scripts/billing/bootstrap-stripe.mjs /opt/services/bin/wl-billing-bootstrap-stripe.mjs
            sudo node /opt/services/bin/wl-billing-bootstrap-stripe.mjs \
              --env-file /opt/services/data/app-env/site-billing.env \
              --write-catalog "${app_dir}/catalog/sites.json" \
              --write-env
          fi

          cd "${app_dir}"
          sudo docker compose -f "${compose_file}" pull
          sudo docker compose -f "${compose_file}" up -d
          sudo docker compose -f "${compose_file}" ps

  # Site contact info (WLEmailAddress / WLPhoneNumber / WLStreetAddress) starts from
  # deploy/cms/site-contacts.json. Only sites with no contacts yet are written, so edits made in
  # Site settings are kept. Runs after every deploy so wl-cms is already on the new version.
  seed-contacts:
    name: seed site contacts
    needs:
      - detect
      - deploy
    runs-on:
      - self-hosted
      - glados
    if: >
      always() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.detect.outputs.has_apps == 'true' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Seed contacts
        run: |
          set -euo pipefail
          KEY=$(sudo sed -n 's/^WL_CMS_API_KEY=//p' /opt/services/data/app-env/wl-cms.env 2>/dev/null | tail -n1 | tr -d '\r' || true)
          if [ -z "$KEY" ]; then echo "::warning::No WL_CMS_API_KEY in wl-cms.env; contacts not seeded"; exit 0; fi
          WL_CMS_API_KEY="$KEY" node scripts/cms/seed-site-contacts.mjs || echo "::warning::Some site contacts weren't seeded (see log)"
