name: Publish app images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/**"
      - "deploy/docker/**"
      - "scripts/**"
      - ".github/workflows/publish-app-images.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nicole-levin
            port: 3005
          - app: a-new-day-coaching
            port: 3007
          - app: a-new-day-coaching-crm
            port: 3008
          - app: beyond-the-bell
            port: 3000
          - app: wl-admin-portal
            port: 25565
          - app: you-can-do-it-gardening
            port: 3003
          - app: joe-dobbelaar
            port: 3002
          - app: talk-about-dreams
            port: 3004
          - app: boston-mixtape
            port: 3010
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wl-universe-${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/node-react-express.Dockerfile
          build-args: |
            APP_DIR=packages/${{ matrix.app }}
            APP_NAME=${{ matrix.app }}
            PORT=${{ matrix.port }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
