name: Publish app images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/**"
      - "deploy/docker/**"
      - "deploy/compose/**"
      - "deploy/billing/**"
      - "deploy/dns/**"
      - "scripts/**"
      - ".github/workflows/publish-app-images.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to build/deploy (comma-separated), or "all"'
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      apps_csv: ${{ steps.detect.outputs.apps_csv }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
      mail_apps_csv: ${{ steps.detect.outputs.mail_apps_csv }}
      has_mail_apps: ${{ steps.detect.outputs.has_mail_apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect apps
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            input="${INPUT_APPS:-all}"
            if [ "${input}" = "all" ] || [ -z "${input}" ]; then
              json="$(node -e '
                import("./scripts/qa/apps.mjs").then((m) => {
                  const apps = m.PUBLISH_APPS.map((a) => a.app);
                  console.log(JSON.stringify({ apps, files: ["workflow_dispatch:all"], scope: "publish" }));
                })
              ')"
            else
              # Validate requested app names against the publish catalog.
              json="$(node -e '
                import("./scripts/qa/apps.mjs").then((m) => {
                  const wanted = process.env.INPUT_APPS.split(",").map((s) => s.trim()).filter(Boolean);
                  const known = new Set(m.PUBLISH_APPS.map((a) => a.app));
                  const apps = [];
                  for (const name of wanted) {
                    if (!known.has(name)) {
                      console.error("Unknown app:", name);
                      process.exit(1);
                    }
                    apps.push(name);
                  }
                  console.log(JSON.stringify({ apps, files: ["workflow_dispatch:" + wanted.join(",")], scope: "publish" }));
                })
              ')"
            fi
          else
            before="${BEFORE_SHA:-}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              echo "No usable before SHA; building all publish apps."
              json="$(node -e '
                import("./scripts/qa/apps.mjs").then((m) => {
                  const apps = m.PUBLISH_APPS.map((a) => a.app);
                  console.log(JSON.stringify({ apps, files: ["fallback:all"], scope: "publish" }));
                })
              ')"
            else
              json="$(node scripts/qa/detect-changed-apps.mjs \
                --base "${before}" \
                --head "${HEAD_SHA}" \
                --scope publish \
                --json)"
            fi
          fi

          echo "detect=${json}"
          apps="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(j.apps||[]))' "${json}")"
          csv="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write((j.apps||[]).join(","))' "${json}")"
          count="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(String((j.apps||[]).length))' "${json}")"

          # Intersection of changed apps with deploy/dns/sites/*.json email.enabled
          mail_csv="$(node -e '
            import("./scripts/dns/load-mail-config.mjs").then((m) => {
              const changed = new Set(JSON.parse(process.argv[1]));
              const mail = m.listEmailEnabledApps().filter((a) => changed.has(a));
              process.stdout.write(mail.join(","));
            })
          ' "${apps}")"

          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "apps_csv=${csv}" >> "$GITHUB_OUTPUT"
          echo "mail_apps_csv=${mail_csv}" >> "$GITHUB_OUTPUT"
          if [ -n "${mail_csv}" ]; then
            echo "has_mail_apps=true" >> "$GITHUB_OUTPUT"
            echo "Will ensure mail DNS for: ${mail_csv}"
          else
            echo "has_mail_apps=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${count}" = "0" ]; then
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            echo "No publishable apps changed — skipping build/deploy."
          else
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
            echo "Will build/deploy: ${csv}"
          fi

  ensure-mail-dns:
    name: ensure mail DNS (changed email sites)
    needs: detect
    if: needs.detect.outputs.has_mail_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure MX + SPF for changed email-enabled apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAIL_APPS: ${{ needs.detect.outputs.mail_apps_csv }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          node scripts/dns/ensure-mail-dns.mjs --apps "${MAIL_APPS}"

  # Single runner so Buildx boots once (moby/buildkit pull).
  publish:
    name: build & push changed images
    needs: detect
    if: needs.detect.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push changed app images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          APPS_CSV: ${{ needs.detect.outputs.apps_csv }}
        run: |
          set -euo pipefail

          # Resolve port/dockerfile from the shared catalog.
          mapfile -t build_entries < <(node -e '
            import("./scripts/qa/apps.mjs").then((m) => {
              const wanted = new Set((process.env.APPS_CSV || "").split(",").filter(Boolean));
              for (const a of m.PUBLISH_APPS) {
                if (!wanted.has(a.app)) continue;
                const file = a.dockerfile || "";
                process.stdout.write(`${a.app}|${a.port}|${file}\n`);
              }
            })
          ')

          if [ "${#build_entries[@]}" -eq 0 ]; then
            echo "Nothing to build."
            exit 0
          fi

          build_one() {
            local app="$1" port="$2" dockerfile="$3"
            local image="ghcr.io/${OWNER}/wl-universe-${app}"
            local file="${dockerfile:-deploy/docker/node-react-express.Dockerfile}"

            echo "::group::Build ${app}"
            docker buildx build \
              --file "${file}" \
              --build-arg "APP_DIR=packages/${app}" \
              --build-arg "APP_NAME=${app}" \
              --build-arg "PORT=${port}" \
              --tag "${image}:latest" \
              --tag "${image}:${SHA}" \
              --cache-from "type=gha,scope=${app}" \
              --cache-to "type=gha,mode=max,scope=${app}" \
              --push \
              .
            echo "::endgroup::"
          }

          max_jobs=3
          fail=0
          declare -a pids=()
          declare -a names=()

          reap() {
            local new_pids=() new_names=()
            local i
            for i in "${!pids[@]}"; do
              local pid="${pids[$i]}"
              if kill -0 "${pid}" 2>/dev/null; then
                new_pids+=("${pid}")
                new_names+=("${names[$i]}")
                continue
              fi
              if ! wait "${pid}"; then
                echo "::error::Build failed for ${names[$i]}"
                fail=1
              fi
            done
            pids=("${new_pids[@]}")
            names=("${new_names[@]}")
          }

          for entry in "${build_entries[@]}"; do
            IFS='|' read -r app port dockerfile <<< "${entry}"
            while [ "${#pids[@]}" -ge "${max_jobs}" ]; do
              sleep 2
              reap
            done
            build_one "${app}" "${port}" "${dockerfile}" &
            pids+=("$!")
            names+=("${app}")
          done

          while [ "${#pids[@]}" -gt 0 ]; do
            reap
            [ "${#pids[@]}" -eq 0 ] || sleep 1
          done

          exit "${fail}"

  deploy:
    name: deploy (${{ matrix.app }})
    needs:
      - detect
      - publish
    runs-on:
      - self-hosted
      - glados
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.detect.outputs.has_apps == 'true' &&
      needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy compose app
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          app_dir="/opt/services/apps/${app}"
          compose_file="${app_dir}/compose.yml"

          sudo mkdir -p "${app_dir}"
          sudo cp "deploy/compose/${app}.yml" "${compose_file}"

          if [ "${app}" = "site-billing" ]; then
            sudo mkdir -p "${app_dir}/catalog"
            sudo mkdir -p /opt/services/data/app-assets/site-billing
            sudo mkdir -p /opt/services/infra/traefik/dynamic
            sudo cp deploy/billing/sites.json "${app_dir}/catalog/sites.json"
            sudo cp scripts/billing/enforce-compose.mjs /opt/services/bin/wl-billing-enforce-compose.mjs
            sudo chmod +x /opt/services/bin/wl-billing-enforce-compose.mjs
            sudo cp deploy/cron/wl-billing.cron /etc/cron.d/wl-billing
            sudo chmod 644 /etc/cron.d/wl-billing
            if [ ! -f /opt/services/data/app-env/site-billing.env ]; then
              sudo cp deploy/compose/site-billing.env.example /opt/services/data/app-env/site-billing.env
              echo "::warning::Created stub site-billing.env — fill STRIPE_* and SITE_BILLING_API_KEY before go-live"
            fi
          fi

          cd "${app_dir}"
          sudo docker compose -f "${compose_file}" pull
          sudo docker compose -f "${compose_file}" up -d
          sudo docker compose -f "${compose_file}" ps
