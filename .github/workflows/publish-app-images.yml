name: Publish app images

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/**"
      - "deploy/docker/**"
      - "deploy/compose/**"
      - "scripts/**"
      - ".github/workflows/publish-app-images.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single runner so Buildx boots once (moby/buildkit pull). A matrix of
  # ubuntu-latest jobs cannot share that image — each cell is a fresh VM.
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all app images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # app|port|dockerfile (dockerfile optional)
          apps=(
            "nicole-levin|3005|"
            "a-new-day-coaching|3007|"
            "a-new-day-coaching-crm|3008|"
            "beyond-the-bell|3000|"
            "wl-admin-portal|25565|"
            "you-can-do-it-gardening|3003|"
            "joe-dobbelaar|3002|"
            "talk-about-dreams|3004|"
            "boston-mixtape|3010|"
            "site-mail|3020|deploy/docker/node-express.Dockerfile"
          )

          build_one() {
            local app="$1" port="$2" dockerfile="$3"
            local image="ghcr.io/${OWNER}/wl-universe-${app}"
            local file="${dockerfile:-deploy/docker/node-react-express.Dockerfile}"

            echo "::group::Build ${app}"
            docker buildx build \
              --file "${file}" \
              --build-arg "APP_DIR=packages/${app}" \
              --build-arg "APP_NAME=${app}" \
              --build-arg "PORT=${port}" \
              --tag "${image}:latest" \
              --tag "${image}:${SHA}" \
              --cache-from "type=gha,scope=${app}" \
              --cache-to "type=gha,mode=max,scope=${app}" \
              --push \
              .
            echo "::endgroup::"
          }

          # Limited parallelism on one Buildx builder (one moby/buildkit pull).
          max_jobs=3
          fail=0
          declare -a pids=()
          declare -a names=()

          reap() {
            local new_pids=() new_names=()
            local i
            for i in "${!pids[@]}"; do
              local pid="${pids[$i]}"
              if kill -0 "${pid}" 2>/dev/null; then
                new_pids+=("${pid}")
                new_names+=("${names[$i]}")
                continue
              fi
              if ! wait "${pid}"; then
                echo "::error::Build failed for ${names[$i]}"
                fail=1
              fi
            done
            pids=("${new_pids[@]}")
            names=("${new_names[@]}")
          }

          for entry in "${apps[@]}"; do
            IFS='|' read -r app port dockerfile <<< "${entry}"
            while [ "${#pids[@]}" -ge "${max_jobs}" ]; do
              sleep 2
              reap
            done
            build_one "${app}" "${port}" "${dockerfile}" &
            pids+=("$!")
            names+=("${app}")
          done

          while [ "${#pids[@]}" -gt 0 ]; do
            reap
            [ "${#pids[@]}" -eq 0 ] || sleep 1
          done

          exit "${fail}"

  deploy:
    name: deploy (${{ matrix.app }})
    needs: publish
    runs-on:
      - self-hosted
      - glados
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nicole-levin
          - app: a-new-day-coaching
          - app: a-new-day-coaching-crm
          - app: beyond-the-bell
          - app: wl-admin-portal
          - app: you-can-do-it-gardening
          - app: joe-dobbelaar
          - app: talk-about-dreams
          - app: boston-mixtape
          - app: site-mail
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy compose app
        run: |
          set -euo pipefail
          app="${{ matrix.app }}"
          app_dir="/opt/services/apps/${app}"
          compose_file="${app_dir}/compose.yml"

          sudo mkdir -p "${app_dir}"
          sudo cp "deploy/compose/${app}.yml" "${compose_file}"

          cd "${app_dir}"
          sudo docker compose -f "${compose_file}" pull
          sudo docker compose -f "${compose_file}" up -d
          sudo docker compose -f "${compose_file}" ps
