name: QA preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qa-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # r2pen2/devops: compose down, delete this PR's cloned data (qa-pr-<n>- Firestore collections via
  # scripts/qa/firestore-qa.mjs, its copy of the CMS files), then sweep the same for any other closed
  # PR whose cleanup didn't finish, and mark the PR comment torn down.
  cleanup:
    uses: r2pen2/devops/.github/workflows/reusable-qa-cleanup.yml@qa/wl-universe-hooks
    with:
      catalog: deploy/apps.json
    secrets: inherit
