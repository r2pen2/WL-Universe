name: QA preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qa-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: teardown QA on glados
    runs-on:
      - self-hosted
      - glados
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compose down + registry remove
        uses: r2pen2/deploy-infra-actions/actions/qa-cleanup@main
        with:
          catalog: deploy/apps.json
          pr: ${{ github.event.pull_request.number }}
          owner: ${{ github.repository_owner }}
          prune-images: "true"
          firestore-script: scripts/qa/firestore-qa.mjs

  comment:
    name: clear QA comment
    needs: cleanup
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark deployments removed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/qa/comment-pr.mjs --pr "$PR" --teardown || true
