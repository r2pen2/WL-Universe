name: Docs GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "packages/web-legos/**"
      - "packages/server-legos/**"
      - "packages/*/client/src/components/**"
      - "scripts/docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install docs workspace
        run: npm install --workspace=@wl-universe/docs

      - name: Generate doc cache (JSDoc index only)
        run: node scripts/docs/generate-all.mjs

      - name: Build static export
        run: npm run build -w @wl-universe/docs
        env:
          # Avoid double-generate: prebuild also runs generate-all
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
