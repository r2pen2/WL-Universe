name: Firestore rules (Bluprint CRM)

# Tests packages/a-new-day-coaching-crm/firestore.rules against the Firestore
# emulator on every PR that touches them, and deploys them to the live
# `a-new-day-coaching` Firebase project once they land on main (or on demand).
#
# Deploying requires repository secret A_NEW_DAY_COACHING_FIREBASE_SERVICE_ACCOUNT:
# the full JSON key of a service account in the a-new-day-coaching project that can
# deploy rules (the "Firebase Rules Admin" role; if the deploy is refused, grant that
# role to the account in Google Cloud IAM). Never commit the key.

on:
  pull_request:
    paths:
      - packages/a-new-day-coaching-crm/firestore.rules
      - packages/a-new-day-coaching-crm/firebase.json
      - packages/a-new-day-coaching-crm/test/firestore.rules.test.cjs
      - .github/workflows/firestore-rules.yml
  push:
    branches: [main]
    paths:
      - packages/a-new-day-coaching-crm/firestore.rules
      - packages/a-new-day-coaching-crm/firebase.json
      - packages/a-new-day-coaching-crm/test/firestore.rules.test.cjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: "13.35.1"

jobs:
  test:
    name: test rules in emulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/a-new-day-coaching-crm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Kept out of the package's own manifest: these are only for this test.
      - name: Install test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/rules-deps"
          npm install --prefix "$RUNNER_TEMP/rules-deps" --no-save --no-audit --no-fund \
            "firebase-tools@${FIREBASE_TOOLS_VERSION}" @firebase/rules-unit-testing@3 firebase@10

      - name: Run rules tests
        env:
          NODE_PATH: ${{ runner.temp }}/rules-deps/node_modules
        run: |
          "$RUNNER_TEMP/rules-deps/node_modules/.bin/firebase" emulators:exec \
            --only firestore --project demo-anewday \
            "node --test test/firestore.rules.test.cjs"

  deploy:
    name: deploy rules to a-new-day-coaching
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/a-new-day-coaching-crm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.A_NEW_DAY_COACHING_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SERVICE_ACCOUNT}" ]; then
            echo "::error::Repository secret A_NEW_DAY_COACHING_FIREBASE_SERVICE_ACCOUNT is not set; see the top of this workflow."
            exit 1
          fi
          printf '%s' "${SERVICE_ACCOUNT}" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy firestore.rules
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only firestore:rules --project a-new-day-coaching --non-interactive

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
