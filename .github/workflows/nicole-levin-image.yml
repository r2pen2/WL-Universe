name: Publish NicoleLevin image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/nicole-levin/**"
      - "packages/web-legos/**"
      - "packages/server-legos/**"
      - "deploy/docker/**"
      - "scripts/**"
      - ".github/workflows/nicole-levin-image.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nicole-levin-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wl-universe-nicole-levin

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/node-react-express.Dockerfile
          build-args: |
            APP_DIR=packages/nicole-levin
            APP_NAME=nicole-levin
            PORT=3005
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
