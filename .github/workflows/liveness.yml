name: Liveness probes

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # Backup to glados cron (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liveness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  liveness:
    name: HTTPS /liveness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe all sites
        run: node scripts/liveness/check.mjs --config deploy/liveness/sites.json
